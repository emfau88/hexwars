<!doctype html><html><head><meta charset="utf-8"><title>Factory exit regression fixture</title>
<script type="importmap">{"imports":{"three":"../../vendor/three.module.min.js"}}</script>
<style>html,body,main,#stage{margin:0;width:100%;height:100%;overflow:hidden}#labels{display:none}</style></head>
<body><main><div id="stage"></div><div id="labels"></div></main><script type="module">
import * as T from 'three';
import {Match} from '../../src/match.js';
import {MatchView} from '../../src/match-view.js';
import {exitDuration} from '../../src/match-layout.js';
const view=new MatchView(document.querySelector('#stage'),document.querySelector('#labels'),()=>{},()=>{});
await view.ready;
let match;
window.EXIT_TEST={
 prepare(type,lane,supply=false){
  view.reset();match=new Match();
  for(const owner of ['orange','blue']){
   match.players[owner].factories=Array.from({length:4},()=>({type,lane}));
   for(const slot of supply?[null]:[0,1,2,3])match.spawn(owner,slot,{type,lane});
  }
  return match.transit.map(u=>({id:u.lane+':'+u.id,duration:exitDuration(u.owner,u.factory,u.lane,u.type,u.x),owner:u.owner,slot:u.factory}));
 },
 sample(time,draw=false,remainder=0){
  match.time=time;match.remainder=remainder;view.dirty=draw;view.renderMatch(match,.05,draw);
  return [...view.poses].map(([id,pose])=>{
   const batch=pose.unit.owner+'-'+pose.unit.type,index=view.pickIds[batch].indexOf(id),matrix=new T.Matrix4();
   view.batches[batch][0].getMatrixAt(index,matrix);
   const direction=new T.Vector3(0,0,-1).transformDirection(matrix);
   return {id,x:matrix.elements[12],z:matrix.elements[14],dx:direction.x,dz:direction.z};
  });
 }
};
</script></body></html>
