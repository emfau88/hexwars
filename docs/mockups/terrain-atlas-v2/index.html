<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terrain Atlas V2</title>
  <style>
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body {
      color:#1c2923;
      background:#101a16;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button { font:inherit; }
    .mockApp { width:100%; height:100%; display:flex; flex-direction:column; background:#16231d; }
    .topbar {
      flex:0 0 62px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
      padding:0 24px; color:#f6e8c8; background:#111a17; border-bottom:1px solid rgba(238,218,176,.16);
    }
    .brand { font-size:18px; font-weight:800; letter-spacing:5px; }
    .progress { justify-self:center; display:flex; align-items:center; gap:12px; color:#e7dfcb; font-size:12px; }
    .progressTrack { width:128px; height:4px; overflow:hidden; border-radius:999px; background:#35453d; }
    .progressTrack i { display:block; width:10%; height:100%; background:#e6934c; }
    .tools { justify-self:end; display:flex; align-items:center; gap:14px; color:#d8dfd9; font-size:13px; }
    .lang { padding:8px 10px; border:1px solid #425248; border-radius:9px; background:#1b2822; }
    .main { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 390px; gap:16px; padding:18px; }
    .atlas,.dossier { min-width:0; min-height:0; overflow:hidden; border:1px solid rgba(230,220,190,.25); }
    .atlas {
      display:flex; flex-direction:column; border-radius:22px; background:#b8cba1;
      box-shadow:0 18px 55px rgba(4,10,7,.24),inset 0 1px rgba(255,255,255,.25);
    }
    .atlasHeader {
      flex:0 0 74px; display:flex; align-items:center; justify-content:space-between; gap:24px;
      padding:0 24px; border-bottom:1px solid rgba(55,81,65,.2); background:rgba(225,232,197,.44);
    }
    .eyebrow { margin:0 0 3px; color:#5c6c5e; font-size:10px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; }
    .atlasHeader h1 { margin:0; font-size:26px; line-height:1; letter-spacing:-.5px; }
    .actLegend { display:flex; align-items:center; gap:18px; color:#4a5a50; font-size:11px; }
    .actLegend span { display:flex; align-items:center; gap:7px; white-space:nowrap; }
    .actLegend i { width:8px; height:8px; border-radius:50%; background:#7f9d6f; }
    .actLegend span:nth-child(2) i { background:#b7a86d; }
    .actLegend span:nth-child(3) i { background:#c47b4c; }
    .atlasBody { position:relative; flex:1; min-height:0; overflow:hidden; }
    #atlasSvg { display:block; width:100%; height:100%; }
    .atlasNote {
      position:absolute; left:18px; bottom:16px; padding:8px 11px; border-radius:10px;
      color:#eaf1e9; background:rgba(24,40,32,.84); font-size:11px; box-shadow:0 5px 18px rgba(8,16,11,.16);
    }
    .dossier {
      display:flex; flex-direction:column; padding:20px; border-radius:22px; background:#eee7d3;
      box-shadow:0 18px 55px rgba(4,10,7,.25),inset 0 1px rgba(255,255,255,.55);
    }
    .dossierTop { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; }
    .dossierTop h2 { margin:2px 0 0; font-size:29px; line-height:1; letter-spacing:-.8px; }
    .state { padding:7px 10px; border:1px solid #94a482; border-radius:9px; color:#52624f; font-size:10px; font-weight:700; letter-spacing:1px; }
    .previewWrap {
      flex:1; min-height:0; margin:17px 0 13px; padding:9px; overflow:hidden; border:1px solid #acb996;
      border-radius:16px; background:#cedcb4; box-shadow:inset 0 1px 10px rgba(64,83,65,.08);
    }
    #previewSvg { display:block; width:100%; height:100%; }
    .objective { display:grid; grid-template-columns:auto 1fr; gap:10px; padding:12px 0; border-top:1px solid #c2bba7; }
    .objectiveMark { width:22px; height:22px; display:grid; place-items:center; border:1px solid #ba7043; transform:rotate(30deg); color:#ba7043; }
    .objectiveMark b { transform:rotate(-30deg); font-size:11px; }
    .objective p { margin:0; color:#4e574d; font-size:12px; line-height:1.45; }
    .objective strong { display:block; margin-bottom:2px; color:#25342c; font-size:12px; }
    .dossierFooter { display:grid; grid-template-columns:1fr 1.4fr; gap:10px; margin-top:2px; }
    .secondary,.start {
      min-height:52px; border-radius:12px; cursor:pointer; font-size:12px; font-weight:800; letter-spacing:1.3px;
    }
    .secondary { color:#35443a; border:1px solid #a9ad98; background:#e1dcc9; }
    .start { color:#172019; border:1px solid #bd713f; background:linear-gradient(#f1bc70,#eaa052); box-shadow:0 7px 14px rgba(122,69,33,.17); }
    .hexCell { stroke:#8fa887; stroke-width:1.35; vector-effect:non-scaling-stroke; }
    .hexCell.water { stroke:#6d9eae; }
    .hexCell.station { stroke:#8f8870; stroke-width:1.75; }
    .hexCell.selected { stroke:#c66535; stroke-width:3; }
    .shore { stroke:#e1c588; stroke-width:5; stroke-linecap:round; vector-effect:non-scaling-stroke; }
    .shoreFine { stroke:#6f9f91; stroke-width:1.2; stroke-linecap:round; vector-effect:non-scaling-stroke; }
    .stationLabel { fill:#27342d; font-size:18px; font-weight:800; text-anchor:middle; dominant-baseline:central; }
    .stationLabel.selected { fill:#4f2c19; }
    .previewNumber { fill:#203129; font-size:13px; font-weight:800; text-anchor:middle; dominant-baseline:central; }
    .previewWave { fill:none; stroke:#d4eff0; stroke-width:1.5; stroke-linecap:round; opacity:.9; }
    @media (max-width:600px) {
      .topbar { flex:0 0 56px; padding:0 10px; grid-template-columns:1fr auto 1fr; }
      .brand { font-size:13px; letter-spacing:2.7px; }
      .progress { gap:6px; font-size:11px; }
      .progressTrack { display:none; }
      .tools { gap:6px; font-size:10px; }
      .lang { padding:7px 7px; border-radius:8px; }
      .main { display:flex; flex-direction:column; gap:8px; padding:8px; }
      .atlas { flex:0 0 310px; border-radius:16px; }
      .atlasHeader { flex:0 0 52px; padding:0 13px; gap:8px; }
      .atlasHeader h1 { font-size:18px; }
      .eyebrow { font-size:10px; letter-spacing:1.1px; }
      .actLegend { gap:8px; font-size:9px; }
      .actLegend span { gap:3px; }
      .actLegend i { width:6px; height:6px; }
      .atlasNote { display:none; }
      .dossier { flex:1; padding:13px; border-radius:16px; }
      .dossierTop h2 { font-size:22px; }
      .state { padding:5px 7px; font-size:8px; }
      .previewWrap { flex:1; margin:9px 0 7px; padding:5px; border-radius:11px; }
      .objective { padding:7px 0; gap:8px; }
      .objectiveMark { width:18px; height:18px; }
      .objective p,.objective strong { font-size:11px; line-height:1.3; }
      .dossierFooter { grid-template-columns:1fr 1.8fr; gap:7px; }
      .secondary,.start { min-height:48px; font-size:11px; border-radius:10px; }
      .stationLabel { font-size:15px; }
    }
  </style>
</head>
<body>
  <div class="mockApp">
    <header class="topbar">
      <div class="brand">HEXFRONT</div>
      <div class="progress"><span>1 / 10</span><span class="progressTrack"><i></i></span></div>
      <div class="tools"><span>CAMPAIGN</span><span class="lang">EN&nbsp; | &nbsp;DE</span></div>
    </header>
    <main class="main">
      <section class="atlas">
        <div class="atlasHeader">
          <div><p class="eyebrow">Terrain atlas</p><h1>Choose a map</h1></div>
          <div class="actLegend" aria-label="Campaign acts"><span><i></i>Basics</span><span><i></i>Terrain</span><span><i></i>Finale</span></div>
        </div>
        <div class="atlasBody">
          <svg id="atlasSvg" viewBox="0 0 760 650" role="img" aria-label="Campaign atlas made from one consistent hex grid"></svg>
          <div class="atlasNote">Every station occupies one real grid cell.</div>
        </div>
      </section>
      <aside class="dossier">
        <div class="dossierTop">
          <div><p class="eyebrow">Level 01 · Basics</p><h2>The Path</h2></div>
          <span class="state">READY</span>
        </div>
        <div class="previewWrap"><svg id="previewSvg" viewBox="0 0 330 500" role="img" aria-label="Level 1 board preview"></svg></div>
        <div class="objective">
          <span class="objectiveMark"><b>◆</b></span>
          <p><strong>Objective</strong>Reach the blue base. Choose tempo or build more production.</p>
        </div>
        <div class="dossierFooter">
          <button class="secondary" type="button">DETAILS</button>
          <button class="start" type="button">START LEVEL</button>
        </div>
      </aside>
    </main>
  </div>
  <script>
    const NS = 'http://www.w3.org/2000/svg';
    const SQRT3 = Math.sqrt(3);

    function node(name, attrs = {}) {
      const element = document.createElementNS(NS, name);
      for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, String(value));
      return element;
    }

    function pointList(cx, cy, size, scale = 1) {
      return Array.from({ length: 6 }, (_, index) => {
        const angle = index * Math.PI / 3;
        return `${cx + Math.cos(angle) * size * scale},${cy + Math.sin(angle) * size * scale}`;
      }).join(' ');
    }

    function edgePoints(cx, cy, size, edge) {
      const a = edge * Math.PI / 3;
      const b = (edge + 1) * Math.PI / 3;
      return [[cx + Math.cos(a) * size, cy + Math.sin(a) * size], [cx + Math.cos(b) * size, cy + Math.sin(b) * size]];
    }

    function grid(width, height, size, left, top) {
      const cells = [];
      for (let q = 0; q < width; q += 1) {
        for (let r = 0; r < height; r += 1) {
          cells.push({ q, r, cx: left + q * size * 1.5, cy: top + r * size * SQRT3 + (q % 2) * size * SQRT3 / 2 });
        }
      }
      return cells;
    }

    function key(cell) { return `${cell.q},${cell.r}`; }
    function findNeighbour(cells, cell, edge, size) {
      const direction = Math.PI / 6 + edge * Math.PI / 3;
      const tx = cell.cx + Math.cos(direction) * size * SQRT3;
      const ty = cell.cy + Math.sin(direction) * size * SQRT3;
      return cells.find(candidate => Math.hypot(candidate.cx - tx, candidate.cy - ty) < 2);
    }

    function addSprite(svg, cell, size, type, index) {
      const href = type === 'conifer' ? '/assets/level1-conifer.webp' : type === 'bush' ? '/assets/level1-bush.webp' : '/assets/level1-tree.webp';
      const clipId = `clip-${svg.id}-${index}`;
      let defs = svg.querySelector('defs');
      if (!defs) { defs = node('defs'); svg.prepend(defs); }
      const clip = node('clipPath', { id: clipId });
      clip.append(node('polygon', { points: pointList(cell.cx, cell.cy, size, .84) }));
      defs.append(clip);
      const visualSize = type === 'bush' ? size * .8 : size * 1.28;
      svg.append(node('image', {
        href, x: cell.cx - visualSize / 2, y: cell.cy - visualSize * .58,
        width: visualSize, height: visualSize, 'clip-path': `url(#${clipId})`, preserveAspectRatio: 'xMidYMid meet', opacity: '.94'
      }));
    }

    function renderAtlas() {
      const svg = document.getElementById('atlasSvg');
      const mobile = matchMedia('(max-width:600px)').matches;
      const size = mobile ? 31 : 39;
      const cells = mobile ? grid(7, 4, size, 50, 27) : grid(11, 8, size, 64, 56);
      svg.setAttribute('viewBox', mobile ? '0 0 390 250' : '0 0 760 650');
      const waterKeys = new Set(mobile
        ? ['5,2','6,0','6,1','6,2','0,2','1,2']
        : ['8,0','9,0','9,1','10,0','10,1','10,2','0,4','0,5','1,5','1,6','2,6']);
      const stations = new Map(mobile
        ? [['0,0','01'],['2,0','02'],['4,0','03'],['1,1','04'],['3,1','05'],['5,1','06'],['0,3','07'],['2,3','08'],['4,3','09'],['6,3','10']]
        : [['1,1','01'],['4,1','02'],['7,1','03'],['2,3','04'],['5,3','05'],['8,3','06'],['1,5','07'],['4,5','08'],['7,5','09'],['9,6','10']]);
      const vegetation = new Map(mobile
        ? [['1,0','tree'],['3,0','conifer'],['5,0','bush'],['2,2','bush'],['4,2','tree'],['1,3','conifer'],['3,3','tree'],['5,3','conifer']]
        : [['0,0','tree'],['2,0','conifer'],['6,0','bush'],['10,4','tree'],['9,4','conifer'],['3,2','bush'],['0,7','conifer'],['2,7','tree'],['5,7','conifer'],['6,6','bush'],['8,7','tree'],['10,7','conifer']]);

      cells.forEach((cell, index) => {
        const cellKey = key(cell);
        const station = stations.get(cellKey);
        const isWater = waterKeys.has(cellKey);
        const band = mobile ? (cell.r < 2 ? 0 : cell.r < 3 ? 1 : 2) : (cell.r < 3 ? 0 : cell.r < 5 ? 1 : 2);
        const landFills = ['#c7d7ae','#becd9d','#b3c592'];
        const polygon = node('polygon', {
          points: pointList(cell.cx, cell.cy, size),
          fill: station ? (station === '01' ? '#efb36a' : '#eee8d1') : isWater ? '#83bfd1' : landFills[band],
          class: `hexCell${station ? ' station' : ''}${station === '01' ? ' selected' : ''}${isWater ? ' water' : ''}`
        });
        svg.append(polygon);
        if (station === '01') svg.append(node('polygon', { points: pointList(cell.cx, cell.cy, size, .78), fill:'none', stroke:'#f6dfae', 'stroke-width':'1.6' }));
        if (station) {
          const label = node('text', { x:cell.cx, y:cell.cy + 1, class:`stationLabel${station === '01' ? ' selected' : ''}` });
          label.textContent = station;
          svg.append(label);
        }
        const type = vegetation.get(cellKey);
        if (type && !isWater && !station) addSprite(svg, cell, size, type, index);
      });

      cells.filter(cell => waterKeys.has(key(cell))).forEach(cell => {
        for (let edge = 0; edge < 6; edge += 1) {
          const neighbour = findNeighbour(cells, cell, edge, size);
          if (!neighbour || !waterKeys.has(key(neighbour))) {
            const [[x1,y1],[x2,y2]] = edgePoints(cell.cx, cell.cy, size, edge);
            svg.append(node('line', { x1,y1,x2,y2,class:'shore' }));
            svg.append(node('line', { x1,y1,x2,y2,class:'shoreFine' }));
          }
        }
      });
    }

    function renderPreview() {
      const svg = document.getElementById('previewSvg');
      const size = 24;
      const cells = grid(7, 10, size, 57, 40);
      const waterKeys = new Set(['0,3','0,4','0,5','1,3','1,4','1,5']);
      const playable = new Map([
        ['3,0',{ fill:'#5da8d1', text:'23' }], ['3,1',{ fill:'#f3efe3', text:'2' }], ['3,2',{ fill:'#f3efe3', text:'3' }],
        ['2,3',{ fill:'#f3efe3', text:'8' }], ['3,3',{ fill:'#f3efe3', text:'2' }], ['4,3',{ fill:'#f3efe3', text:'2' }],
        ['2,4',{ fill:'#f3efe3', text:'3' }], ['3,4',{ fill:'#f3efe3', text:'3' }], ['4,4',{ fill:'#f3efe3', text:'2' }],
        ['2,5',{ fill:'#f3efe3', text:'5' }], ['3,5',{ fill:'#f3efe3', text:'3' }], ['4,5',{ fill:'#f3efe3', text:'3' }],
        ['3,6',{ fill:'#f3efe3', text:'3' }], ['2,7',{ fill:'#f3efe3', text:'8' }], ['3,7',{ fill:'#f3efe3', text:'2' }], ['4,7',{ fill:'#f3efe3', text:'2' }],
        ['3,8',{ fill:'#f3efe3', text:'3' }], ['3,9',{ fill:'#ed8d48', text:'23' }]
      ]);
      const vegetation = new Map([['5,1','tree'],['6,1','conifer'],['5,3','bush'],['5,5','tree'],['0,8','conifer'],['1,8','tree'],['5,8','tree'],['6,8','conifer']]);

      cells.forEach((cell,index) => {
        const cellKey = key(cell);
        const field = playable.get(cellKey);
        const isWater = waterKeys.has(cellKey);
        svg.append(node('polygon', {
          points:pointList(cell.cx,cell.cy,size), fill:field?.fill || (isWater ? '#83bfd1' : '#bdd2a8'),
          class:`hexCell${isWater ? ' water' : ''}`
        }));
        if (field) {
          const text = node('text',{ x:cell.cx,y:cell.cy + .5,class:'previewNumber' });
          text.textContent = field.text;
          svg.append(text);
        }
        const type = vegetation.get(cellKey);
        if (type && !isWater && !field) addSprite(svg,cell,size,type,100 + index);
        if (isWater) {
          const wave = node('path',{ d:`M ${cell.cx-8} ${cell.cy} q 5 -3 10 0 q 5 3 10 0`,class:'previewWave' });
          svg.append(wave);
        }
      });
      cells.filter(cell => waterKeys.has(key(cell))).forEach(cell => {
        for (let edge=0; edge<6; edge+=1) {
          const neighbour=findNeighbour(cells,cell,edge,size);
          if (!neighbour || !waterKeys.has(key(neighbour))) {
            const [[x1,y1],[x2,y2]]=edgePoints(cell.cx,cell.cy,size,edge);
            svg.append(node('line',{x1,y1,x2,y2,class:'shore'}));
            svg.append(node('line',{x1,y1,x2,y2,class:'shoreFine'}));
          }
        }
      });
    }

    renderAtlas();
    renderPreview();
  </script>
</body>
</html>
